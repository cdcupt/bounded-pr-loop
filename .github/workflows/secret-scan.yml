name: Reusable — Secret Scan
# Runs gitleaks against the PR diff. Posts a comment on findings and fails
# the check so branch protection blocks the merge. Deterministic; not LLM-based.
#
# Consumer repos pull this in alongside the Codex review gate. Either gate
# failing is sufficient to block merge.

on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: secret-scan-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans history within the PR range

      - name: Resolve PR head + base
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "${{ inputs.pr_number }}" --json baseRefOid,headRefOid > /tmp/pr.json
          echo "base=$(jq -r .baseRefOid /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .headRefOid /tmp/pr.json)" >> "$GITHUB_OUTPUT"

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSLo gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan diff
        id: scan
        run: |
          # --log-opts scopes to commits in the PR only; --report-format json
          # gives us structured findings; exit 1 on any leak.
          gitleaks detect \
            --source . \
            --log-opts "${{ steps.pr.outputs.base }}..${{ steps.pr.outputs.head }}" \
            --report-format json \
            --report-path /tmp/gitleaks.json \
            --no-banner \
            --redact \
            || echo "leak_found=true" >> "$GITHUB_OUTPUT"

      - name: Post finding comment (only if leaks found)
        if: steps.scan.outputs.leak_found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, textwrap
          with open("/tmp/gitleaks.json") as f:
              findings = json.load(f)
          if not findings:
              raise SystemExit(0)
          lines = ["<!-- gitleaks-scan -->",
                   f"## 🔒 Secret Scan: **{len(findings)} potential leak(s) detected**",
                   "",
                   "_Values are redacted in the table below; check the referenced commit + file locally._",
                   "",
                   "| File | Rule | Commit |",
                   "|------|------|--------|"]
          for f in findings[:25]:
              lines.append(f"| `{f.get('File','?')}` | {f.get('RuleID','?')} | `{f.get('Commit','?')[:8]}` |")
          if len(findings) > 25:
              lines.append(f"| _…and {len(findings)-25} more_ | | |")
          lines += ["",
                    "**Auto-merge is blocked until every finding is either removed",
                    "or explicitly allowlisted in `.gitleaks.toml`.**"]
          body = "\n".join(lines)
          subprocess.run(
              ["gh", "pr", "comment", str(${{ inputs.pr_number }}),
               "--repo", os.environ["GITHUB_REPOSITORY"], "--body", body],
              check=True,
          )
          EOF
          exit 1   # fail the check so branch protection blocks
